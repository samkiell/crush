<thead data-lines="8,9">
<tr data-lines="8,9">
<th>Item</th>
<th>Description</th>
</tr>
</thead>
<tbody data-lines="10,14">
<tr data-lines="10,11">
<td><strong>Objective</strong></td>
<td>Consolidate JAMB, WAEC, NECO &amp; OAU PUTME prep into one AI-personalised, offline-first platform.</td>
</tr>
<tr data-lines="11,12">
<td><strong>Success Metrics</strong></td>
<td>≥ 92 % CBT reliability, ↑ weekly active learners, ↓ time-to-mastery, ↑ freemium→premium conversion.</td>
</tr>
<tr data-lines="12,13">
<td><strong>Tech Stack</strong></td>
<td>MERN + Tailwind + Vite, JWT auth, optional mobile wrapper.</td>
</tr>
<tr data-lines="13,14">
<td><strong>Constraints</strong></td>
<td>Verified question banks only; offline mode mandatory for NG connectivity.</td>
</tr>
</tbody>
</table></div></div></foreignObject></g><g data-depth="2" data-path="1.2" class="markmap-node" transform="translate(390, -388.875)"><line stroke="#ff7f0e" stroke-width="1.75" x1="-1" x2="332" y1="20.875" y2="20.875"/><circle stroke-width="1.5" r="6" stroke="#ff7f0e" fill="var(--markmap-circle-open-bg)" cx="330" cy="20.875"/><foreignObject class="markmap-foreign" x="8" y="0" style="opacity: 1;" width="314" height="20"><div xmlns="http://www.w3.org/1999/xhtml"><div xmlns="http://www.w3.org/1999/xhtml">1. Executive Summary &amp; Strategic Objective</div></div></foreignObject></g><g data-depth="3" data-path="1.4.5" class="markmap-node" transform="translate(607, -315.5)"><line stroke="#9467bd" stroke-width="1.375" x1="-1" x2="188" y1="20.6875" y2="20.6875"/><foreignObject class="markmap-foreign" x="8" y="0" style="opacity: 1;" width="170" height="20"><div xmlns="http://www.w3.org/1999/xhtml"><div xmlns="http://www.w3.org/1999/xhtml">1. Landing &amp; acquisition</div></div></foreignObject></g><g data-depth="3" data-path="1.4.6" class="markmap-node" transform="translate(607, -289.125)"><line stroke="#8c564b" stroke-width="1.375" x1="-1" x2="437" y1="20.6875" y2="20.6875"/><foreignObject class="markmap-foreign" x="8" y="0" style="opacity: 1;" width="419" height="20"><div xmlns="http://www.w3.org/1999/xhtml"><div xmlns="http://www.w3.org/1999/xhtml">2. Exam categories (WAEC | NECO | JAMB | PUTME | DE)</div></div></foreignObject></g><g data-depth="3" data-path="1.4.7" class="markmap-node" transform="translate(607, -262.75)"><line stroke="#e377c2" stroke-width="1.375" x1="-1" x2="200" y1="20.6875" y2="20.6875"/><foreignObject class="markmap-foreign" x="8" y="0" style="opacity: 1;" width="182" height="20"><div xmlns="http://www.w3.org/1999/xhtml"><div xmlns="http://www.w3.org/1999/xhtml">3. CBT engine + analytics</div></div></foreignObject></g><g data-depth="3" data-path="1.4.8" class="markmap-node" transform="translate(607, -236.375)"><line stroke="#7f7f7f" stroke-width="1.375